# MangoWC 配置(~/.config/mango/config.conf)。
#
# 基线 = 上游默认配置(pkgs.mangowc 里的 /etc/mango/config.conf),
# 只改必要的几处,都标了「本机调整」/「方案四」,其余保持默认,方便对照上游文档。
#
# 本机约定:
#   新增/改动绑定后,把被替代的上游默认绑定【注释掉】,而不是两套并存。
#   注释行后面写一句为什么,方便日后回溯。
#
# mango 自带 auto_reload_config=1:保存本文件即热重载,
# 不需要 `nh home switch`,也不需要重启会话。
# 全部选项见 https://github.com/mangowm/mango/wiki/

# More option see https://github.com/DreamMaoMao/mango/wiki/

# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color= 0x000000ff

border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000055

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_master_factor=0.55
default_master_count=1
tag_num=9
smart_gaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# Monocle Layout Setting
monocle_tab_mode=1
monocle_no_border=0
monocle_no_gap=0

# Deck Layout Setting
deck_tab_mode=1

# Overview Setting
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5
title_message_bar_height=52
title_message_bar_gap=20

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_direction_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=4
root_color=0x201b14ff
border_color=0x444444ff
drop_color=0x8FBA7C55
split_color=0xEB441EFF
focus_color=0xc9b890ff
maximized_screen_color=0x89aa61ff
urgent_color=0xad401fff
scratchpad_color=0x516c93ff
global_color=0xb153a7ff
overlay_color=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile

# ── 本机调整 1:登录后自动启动的程序 ───────────────────────────────────
# noctalia:和 niri 会话里是同一个外壳(状态栏 / 启动器 / 通知 / 壁纸),
# 由 home/common/noctalia.nix 安装,二进制叫 noctalia。
exec_once=noctalia

# XDG 自启动(/etc/xdg/autostart + ~/.config/autostart):fcitx5、FlClash …
# 全靠这一行。mango 自己不会启动 xdg-desktop-autostart.target,
# 而那个 target 是 RefuseManualStart=yes,不能直接 start,
# 所以 system 侧补了一个 oneshot 单元用 Wants= 去拉
# (见 modules/desktop/mango.nix)。
# 必须在这里触发:要等合成器起来、有 WAYLAND_DISPLAY 之后才能启动客户端。
exec_once=systemctl --user start mango-xdg-autostart.service

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
# 重载很少用,挪到 Super+Ctrl+R,把 Super+R 让给比例循环(同 niri 的 Mod+R)
bind=SUPER+CTRL,r,reload_config
# bind=SUPER,r,reload_config    # 旧键位

# menu and terminal
# ── 方案四:常用键位向 niri 看齐(改用 Super,不用 Alt)──────────
# niri 的 Mod 就是 Super,而应用菜单几乎不用 Super+字母,
# 所以两边用同一套键:既不用记两套,也不会抢走
# Alt+F(File)、Alt+E(Edit)、Alt+V(View)、Alt+H(Help) 这类菜单助记键。
#   Super+T = 终端 ≈ niri Mod+T    Super+D = 启动器 ≈ niri Mod+D
# 上游的 Alt+Space / Alt+Return 按本机约定注释掉,不再两套并存。
# 本机调整 2:启动器 rofi → fuzzel(rofi 没装)
bind=SUPER,d,spawn,fuzzel
# bind=Alt,space,spawn,fuzzel    # 上游默认,已被 Super+D 取代
# 本机调整 3:终端 foot → kitty
bind=SUPER,t,spawn,kitty
# bind=Alt,Return,spawn,kitty    # 上游默认,已被 Super+T 取代

# 浏览器:niri 用 Mod+N,但 mango 的 Super+N 已给切布局(mango-layout),
# 这是唯一一处有意不对齐。用 Super+D 启动器输 firefox 即可,不再单独占键。

# exit
# bind=SUPER,m,quit
bind=Ctrl+Alt,Insert,quit
# 关窗:上游是 Alt+Q,改成 Super+Q 对齐 niri 的 Mod+Q
bind=SUPER,q,killclient,
# bind=ALT,q,killclient,    # 上游默认,已被 Super+Q 取代

# switch window focus
bind=SUPER,Tab,focusstack,next
# 方向键:上游是 Alt+方向,改成 Super+方向,和 niri 的 Mod+方向 一致
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
# bind=ALT,Left,focusdir,left    # 上游默认,已被 Super+方向 取代
# bind=ALT,Right,focusdir,right
# bind=ALT,Up,focusdir,up
# bind=ALT,Down,focusdir,down
# 方案四:vim 风格 HJKL。niri 是 Mod+H/J/K/L,这里同样用 Super,
# 避免抢走 Alt+H(Help)。方向键那套 Alt+方向 是上游默认,保留。
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right

# move window
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right
# 方案四:Super+Ctrl+H/J/K/L 移窗,对齐 niri 的 Mod+Ctrl+H/J/K/L
# Ctrl+Shift+方向键 / Ctrl+Alt+方向键 的微调(平移/缩放)保持不变
bind=SUPER+CTRL,h,move_client,left
bind=SUPER+CTRL,j,move_client,down
bind=SUPER+CTRL,k,move_client,up
bind=SUPER+CTRL,l,move_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,togglejump,
# 方案四:Super+V = niri Mod+V;上游的 Alt+\ 按规定注释掉。
bind=SUPER,v,togglefloating,
# bind=ALT,backslash,togglefloating,    # 上游默认,已被 Super+V 取代
# 铺满屏幕:上游是 Alt+A,改成 Super+F 对齐 niri 的 Mod+F
bind=SUPER,f,togglemaximizescreen,
# bind=ALT,a,togglemaximizescreen,    # 上游默认,已被 Super+F 取代
# 全屏:上游是 Alt+F,改成 Super+Shift+F 对齐 niri 的 Mod+Shift+F
bind=SUPER+SHIFT,f,togglefullscreen,
# bind=ALT,f,togglefullscreen,    # 上游默认,已被 Super+Shift+F 取代
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout
# 占满宽度:上游是 Alt+E,改成 Super+Ctrl+F 对齐 niri 的 Mod+Ctrl+F
bind=SUPER+CTRL,f,set_proportion,1.0
# bind=ALT,e,set_proportion,1.0    # 上游默认,已被 Super+Ctrl+F 取代
# 比例循环:上游是 Alt+X,改成 Super+R 对齐 niri 的 Mod+R
bind=SUPER,r,switch_proportion_preset,
# bind=ALT,x,switch_proportion_preset,    # 上游默认,已被 Super+R 取代
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout
# ── 本机调整 8:切布局时显示算法名 ──────────────────────────
# mango 没有内置 OSD,用 home 侧的 mango-layout 脚本:
#   调 switch_layout 后用 mmsg 查出当前 tag 的布局名,再用 noctalia 弹通知。
bind=SUPER,n,spawn,mango-layout

# tag switch
# Super+←/→ 原先在这里切 tag,已让位给「焦点」(和 niri 的 Mod+←/→ 一致)。
# 切 tag 用 Super+1..9,跳到左右有窗口的 tag 用 Ctrl+←/→。
# bind=SUPER,Left,viewtoleft,0      # 已改为 focusdir
# bind=SUPER,Right,viewtoright,0    # 已改为 focusdir
bind=CTRL,Left,viewtoleft_have_client,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

# ── 方案四:tag(工作区)键位对齐 niri ───────────────────────
# niri: Mod+1..9 切工作区 / Mod+Ctrl+1..9 把列移到工作区
# 这里用同样的 Super+1..9 / Super+Ctrl+1..9。
# 上游那套(Ctrl+1..9 切 / Alt+1..9 移)功能重复,已注释掉。
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# 把窗口移到 tag 并跟过去(对应 niri 的 Mod+Ctrl+1..9)
bind=SUPER+CTRL,1,tag,1,0
bind=SUPER+CTRL,2,tag,2,0
bind=SUPER+CTRL,3,tag,3,0
bind=SUPER+CTRL,4,tag,4,0
bind=SUPER+CTRL,5,tag,5,0
bind=SUPER+CTRL,6,tag,6,0
bind=SUPER+CTRL,7,tag,7,0
bind=SUPER+CTRL,8,tag,8,0
bind=SUPER+CTRL,9,tag,9,0

# ── 上游默认键位(已注释) ──────────────────────────────
# 新的 Super+1..9 / Super+Ctrl+1..9 已经覆盖同样的功能,按本机约定不再保留两套。
# bind=Ctrl,1,view,1,0
# bind=Ctrl,2,view,2,0
# bind=Ctrl,3,view,3,0
# bind=Ctrl,4,view,4,0
# bind=Ctrl,5,view,5,0
# bind=Ctrl,6,view,6,0
# bind=Ctrl,7,view,7,0
# bind=Ctrl,8,view,8,0
# bind=Ctrl,9,view,9,0

# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
# bind=Alt,1,tag,1,0
# bind=Alt,2,tag,2,0
# bind=Alt,3,tag,3,0
# bind=Alt,4,tag,4,0
# bind=Alt,5,tag,5,0
# bind=Alt,6,tag,6,0
# bind=Alt,7,tag,7,0
# bind=Alt,8,tag,8,0
# bind=Alt,9,tag,9,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# ── 本机调整 4:多媒体键 ───────────────────────────────────────
# mango 上游默认不绑定任何 XF86 键,所以音量/亮度/播放键完全没反应
# (niri 的 base.kdl 自带这些绑定,所以那边一直是好的)。
# 注意 bind= 第一个字段是修饰键,没有修饰键必须写 NONE。
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.04+ -l 1.0
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.04- -l 1.0
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioStop,spawn,playerctl stop
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl --class=backlight set +10%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl --class=backlight set 10%-

# ── 本机调整 5:截图 ───────────────────────────────────────────
# mango 没有内置截图;用用户侧的 mango-shot 脚本(home/common/mango.nix)。
#   Super+P       选区 → satty 标注 → 回车存盘 + 复制到剪贴板
#   Super+Ctrl+P  整屏 → 直接存盘 + 复制
# 选区时按 Esc 取消。satty 窗口里回车=保存并复制，Esc=退出(保留原图)。
bind=SUPER,p,spawn,mango-shot region
bind=SUPER+CTRL,p,spawn,mango-shot full
# satty 的窗口要浮动,否则会被平铺(按 app_id 模糊匹配)。
window_rule=is_floating:1,app_id:.*satty.*

# ── 本机调整 6:快捷键速查(Super+Shift+/)────────────────────────────
# 和 Alt+Shift+/ 同一套(浮动 foot + fzf)，只是直接指定合成器的表。
bind=SUPER+SHIFT,Slash,spawn_shell,$HOME/.nix-profile/bin/keys mango

# 当前应用快捷键速查(Alt+Shift+Slash)。
# 系统键位不变(上面那条 Super+Shift+Slash 仍然打开 mango 自己的表)。
# 窗口固定 0.66×0.8:fzf 是单栏检索，不需要按内容算尺寸。
bind=ALT+SHIFT,Slash,spawn_shell,$HOME/.nix-profile/bin/keys
window_rule=is_floating:1,width:0.66,height:0.8,app_id:keys

# ── 本机调整 7:会话/电源 ───────────────────────────────────────
# Ctrl+Alt+Delete:呼出 noctalia 的会话面板(关机/重启/注销/锁屏),
#                  与 niri 里的 Ctrl+Alt+Delete 完全一致。
# Super+Alt+L:锁屏(swaylock),解锁要输密码;与 niri 的 Super+Alt+L 一致。
bind=CTRL+ALT,Delete,spawn,noctalia msg panel-toggle session
bind=SUPER+ALT,l,spawn,swaylock

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Gesture Bindings
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview


# layer rule
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi
